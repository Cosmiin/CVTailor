project_id = "cv-maker"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://cvtailor.pages.dev"
additional_redirect_urls = ["http://localhost:5173/**", "https://cvtailor.pages.dev/**"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.parse-cv]
verify_jwt = true

[functions.import-job]
verify_jwt = true

[functions.tailor-cv]
verify_jwt = true

[functions.enrich-experience]
verify_jwt = true

[functions.job-interview]
verify_jwt = true

[functions.transcribe-audio]
verify_jwt = true

[functions.openai-response-webhook]
verify_jwt = false

[functions.finalize-job-parses]
verify_jwt = false

[functions.delete-account]
verify_jwt = true
